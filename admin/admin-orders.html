<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders - AuIrphila Bakery</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e67e22;
            --secondary-color: #e74c3c;
            --accent-color: #f1c40f;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --border-radius: 15px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            color: var(--dark-color);
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 250px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            box-shadow: var(--shadow);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .admin-content {
            flex: 1;
            margin-left: 250px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .admin-logo img {
            max-width: 150px;
            height: auto;
        }

        .admin-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .admin-nav li {
            margin-bottom: 10px;
        }

        .admin-nav a {
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .admin-nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .admin-nav a.active {
            background-color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
        }

        .admin-nav i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .admin-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            color: var(--primary-color);
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .stat-icon i {
            color: white;
            font-size: 24px;
        }

        .stat-info h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .stat-info p {
            margin: 5px 0 0;
            color: #777;
            font-size: 14px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--dark-color);
            font-size: 24px;
            cursor: pointer;
        }

        .admin-user {
            display: flex;
            align-items: center;
        }

        .admin-user img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .admin-user-info {
            line-height: 1.2;
        }

        .admin-user-info h4 {
            margin: 0;
            font-size: 16px;
        }

        .admin-user-info p {
            margin: 0;
            font-size: 12px;
            color: #777;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
        }

        .admin-actions button {
            background: none;
            border: none;
            color: #777;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .admin-actions button:hover {
            color: var(--primary-color);
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.8s ease;
        }

        .welcome-message h1 {
            color: var(--primary-color);
            font-size: 36px;
            margin-bottom: 20px;
        }

        .welcome-message p {
            font-size: 18px;
            color: #555;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                z-index: 100;
            }
            
            .admin-content {
                margin-left: 0;
            }
            
            .menu-toggle {
                display: block;
            }
            
            .admin-sidebar.active {
                transform: translateX(0);
            }
            
            .admin-stats {
                grid-template-columns: 1fr;
            }
        }

        /* Loading animation */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 1000;
        }
        
        /* Orders Table Styles */
        .orders-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-size: 14px;
            color: #555;
        }
        
        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            margin-top: auto;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .btn-danger {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .orders-table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        .orders-table th,
        .orders-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .orders-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        .orders-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .loading-row td {
            text-align: center;
            padding: 30px;
            color: #777;
        }
        
        .order-actions {
            display: flex;
            gap: 5px;
        }
        
        .order-actions button {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .pagination button {
            background-color: #f0f0f0;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .pagination button:disabled {
            background-color: #ddd;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .pagination button:not(:disabled):hover {
            background-color: #e0e0e0;
        }
        
        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            text-transform: capitalize;
        }
        
        .status-pending {
            background-color: #ffeeba;
            color: #856404;
        }
        
        .status-received {
            background-color: #b8daff;
            color: #004085;
        }
        
        .status-preparing {
            background-color: #c3e6cb;
            color: #155724;
        }
        
        .status-ready {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        
        .status-picked-up {
            background-color: #d6d8db;
            color: #383d41;
        }
        
        .status-delivered {
            background-color: #c3e6cb;
            color: #155724;
        }
        
        .status-cancelled {
            background-color: #f5c6cb;
            color: #721c24;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 0;
            width: 90%;
            max-width: 800px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            background-color: #f8f9fa;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
        }
        
        .modal-header h3 {
            margin: 0;
            color: var(--primary-color);
        }
        
        .close-modal {
            font-size: 24px;
            font-weight: bold;
            color: #777;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            border-bottom-left-radius: var(--border-radius);
            border-bottom-right-radius: var(--border-radius);
        }
        
        .status-update {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Order details styles */
        .order-details {
            font-size: 14px;
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .order-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .info-group label {
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        
        .info-group p {
            margin: 0;
        }
        
        .order-items-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .items-table th, .items-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .items-table th {
            font-weight: 600;
            color: #555;
        }
        
        /* Success and error messages */
        .success-message, .error-message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }
        
        .success-message {
            background-color: #28a745;
        }
        
        .error-message {
            background-color: #dc3545;
        }
        
        .success-message.show, .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(230, 126, 34, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Admin login protection overlay */
        .admin-login-protection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 62, 80, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .admin-login-form {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }

        .admin-login-form h2 {
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .admin-login-form .input-group {
            margin-bottom: 20px;
        }

        .admin-login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .admin-login-form input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .admin-login-form input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .admin-login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-login-form button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .admin-login-form .error-message {
            color: var(--secondary-color);
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .admin-login-form .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .admin-login-form .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- Admin Login Protection -->
    <div class="admin-login-protection" id="adminLoginProtection">
        <div class="admin-login-form">
            <h2>Admin Access</h2>
            <div class="error-message" id="adminLoginError"></div>
            <form id="adminLoginForm">
                <div class="input-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" placeholder="Enter admin email" required>
                </div>
                <div class="input-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <a href="../index.html" class="back-link">Back to Website</a>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container" id="adminDashboard">
        <div class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <h2>AuIrphila Admin</h2>
            </div>
            <ul class="admin-nav">
                <li><a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="admin-orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="#"><i class="fas fa-birthday-cake"></i> Products</a></li>
                <li><a href="#"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="#"><i class="fas fa-star"></i> Reviews</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
            <div class="admin-logout">
                <a href="#" id="adminLogout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="admin-content">
            <div class="admin-header">
                <div class="welcome-user">
                    <div class="admin-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="admin-welcome">
                        <h3>Order Management</h3>
                        <p>View and manage all customer orders</p>
                    </div>
                </div>
                <div class="admin-actions">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>

            <div class="admin-card">
                <h2>Orders Overview</h2>
                <div class="orders-filter">
                    <div class="filter-group">
                        <label for="statusFilter">Filter by Status:</label>
                        <select id="statusFilter">
                            <option value="all">All Orders</option>
                            <option value="pending">Pending</option>
                            <option value="received">Received</option>
                            <option value="preparing">Preparing</option>
                            <option value="ready">Ready for Pickup</option>
                            <option value="picked-up">Picked Up</option>
                            <option value="delivered">Delivered</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="dateFilter">Filter by Date:</label>
                        <input type="date" id="dateFilter">
                    </div>
                    <div class="filter-group">
                        <button id="clearFilters" class="btn-secondary">Clear Filters</button>
                    </div>
                </div>
                
                <div class="orders-table-container">
                    <table class="orders-table" id="ordersTable">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders will be loaded here dynamically -->
                            <tr class="loading-row">
                                <td colspan="7">Loading orders...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination" id="ordersPagination">
                    <button id="prevPage" disabled>&laquo; Previous</button>
                    <span id="pageInfo">Page 1</span>
                    <button id="nextPage">Next &raquo;</button>
                </div>
            </div>
            
            <!-- Order Details Modal -->
            <div class="modal" id="orderDetailsModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Order Details</h3>
                        <span class="close-modal">&times;</span>
                    </div>
                    <div class="modal-body" id="orderDetailsContent">
                        <!-- Order details will be loaded here -->
                    </div>
                    <div class="modal-footer">
                        <div class="status-update">
                            <label for="orderStatus">Update Status:</label>
                            <select id="orderStatus">
                                <option value="pending">Pending</option>
                                <option value="received">Received</option>
                                <option value="preparing">Preparing</option>
                                <option value="ready">Ready for Pickup</option>
                                <option value="picked-up">Picked Up</option>
                                <option value="delivered">Delivered</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                            <button id="updateOrderStatus" class="btn-primary">Update Status</button>
                        </div>
                        <button class="btn-secondary close-modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading spinner after page loads
            const loadingSpinner = document.getElementById('loadingSpinner');
            loadingSpinner.style.display = 'none';
            
            // Global variables
            let allOrders = [];
            let currentPage = 1;
            const ordersPerPage = 10;
            let currentOrderId = null;
            
            // DOM elements
            const ordersTableBody = document.getElementById('ordersTableBody');
            const statusFilter = document.getElementById('statusFilter');
            const dateFilter = document.getElementById('dateFilter');
            const clearFiltersBtn = document.getElementById('clearFilters');
            const prevPageBtn = document.getElementById('prevPage');
            const nextPageBtn = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');
            const orderDetailsModal = document.getElementById('orderDetailsModal');
            const orderDetailsContent = document.getElementById('orderDetailsContent');
            const orderStatusSelect = document.getElementById('orderStatus');
            const updateOrderStatusBtn = document.getElementById('updateOrderStatus');
            
            // Initialize the orders page
            async function initOrdersPage() {
                try {
                    await fetchOrders();
                    setupEventListeners();
                } catch (error) {
                    console.error('Error initializing orders page:', error);
                    showErrorMessage('Failed to load orders. Please try again later.');
                }
            }
            
            // Fetch orders from the database
            async function fetchOrders() {
                try {
                    const { data, error } = await supabase
                        .from('orders')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (error) throw error;
                    
                    allOrders = data || [];
                    console.log('Orders fetched:', allOrders);
                    
                    // Apply filters and display orders
                    filterAndDisplayOrders();
                    
                } catch (error) {
                    console.error('Error fetching orders:', error);
                    showErrorMessage('Failed to fetch orders from the database.');
                }
            }
            
            // Filter and display orders
            function filterAndDisplayOrders() {
                // Apply filters
                let filteredOrders = [...allOrders];
                
                // Status filter
                const statusValue = statusFilter.value;
                if (statusValue && statusValue !== 'all') {
                    filteredOrders = filteredOrders.filter(order => order.status === statusValue);
                }
                
                // Date filter
                const dateValue = dateFilter.value;
                if (dateValue) {
                    const selectedDate = new Date(dateValue);
                    selectedDate.setHours(0, 0, 0, 0);
                    
                    filteredOrders = filteredOrders.filter(order => {
                        const orderDate = new Date(order.created_at);
                        orderDate.setHours(0, 0, 0, 0);
                        return orderDate.getTime() === selectedDate.getTime();
                    });
                }
                
                // Calculate pagination
                const totalPages = Math.ceil(filteredOrders.length / ordersPerPage);
                const startIndex = (currentPage - 1) * ordersPerPage;
                const endIndex = startIndex + ordersPerPage;
                const ordersToDisplay = filteredOrders.slice(startIndex, endIndex);
                
                // Update pagination controls
                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
                pageInfo.textContent = `Page ${currentPage} of ${totalPages || 1}`;
                
                // Display orders
                displayOrders(ordersToDisplay);
            }
            
            // Display orders in the table
            function displayOrders(orders) {
                // Clear the table body
                ordersTableBody.innerHTML = '';
                
                if (orders.length === 0) {
                    // No orders to display
                    const noOrdersRow = document.createElement('tr');
                    noOrdersRow.innerHTML = `<td colspan="7" class="loading-row">No orders found</td>`;
                    ordersTableBody.appendChild(noOrdersRow);
                    return;
                }
                
                // Add orders to the table
                orders.forEach(order => {
                    const row = document.createElement('tr');
                    
                    // Format date
                    const orderDate = new Date(order.created_at);
                    const formattedDate = orderDate.toLocaleDateString() + ' ' + orderDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    // Format items count
                    const itemsCount = order.items ? order.items.length : 0;
                    
                    // Format total
                    const total = order.total_amount ? `₹${order.total_amount.toFixed(2)}` : 'N/A';
                    
                    // Create status badge
                    const statusClass = `status-${order.status || 'pending'}`;
                    const statusBadge = `<span class="status-badge ${statusClass}">${order.status || 'pending'}</span>`;
                    
                    row.innerHTML = `
                        <td>${order.id}</td>
                        <td>${order.customer_name || 'Guest'}</td>
                        <td>${formattedDate}</td>
                        <td>${itemsCount} item(s)</td>
                        <td>${total}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <div class="order-actions">
                                <button class="btn-primary view-order" data-id="${order.id}">View</button>
                            </div>
                        </td>
                    `;
                    
                    ordersTableBody.appendChild(row);
                });
                
                // Add event listeners to view buttons
                document.querySelectorAll('.view-order').forEach(button => {
                    button.addEventListener('click', function() {
                        const orderId = this.getAttribute('data-id');
                        openOrderDetails(orderId);
                    });
                });
            }
            
            // Open order details modal
            function openOrderDetails(orderId) {
                const order = allOrders.find(o => o.id == orderId);
                if (!order) return;
                
                currentOrderId = orderId;
                
                // Format date
                const orderDate = new Date(order.created_at);
                const formattedDate = orderDate.toLocaleDateString() + ' ' + orderDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                // Build items HTML
                let itemsHtml = '<div class="order-items">';
                if (order.items && order.items.length > 0) {
                    itemsHtml += '<table class="items-table"><thead><tr><th>Item</th><th>Quantity</th><th>Price</th></tr></thead><tbody>';
                    order.items.forEach(item => {
                        itemsHtml += `
                            <tr>
                                <td>${item.name}</td>
                                <td>${item.quantity}</td>
                                <td>₹${item.price.toFixed(2)}</td>
                            </tr>
                        `;
                    });
                    itemsHtml += '</tbody></table>';
                } else {
                    itemsHtml += '<p>No items found for this order.</p>';
                }
                itemsHtml += '</div>';
                
                // Set the current status in the select dropdown
                orderStatusSelect.value = order.status || 'pending';
                
                // Build order details HTML
                const detailsHtml = `
                    <div class="order-details">
                        <div class="order-header">
                            <h4>Order #${order.id}</h4>
                            <span class="status-badge status-${order.status || 'pending'}">${order.status || 'pending'}</span>
                        </div>
                        
                        <div class="order-info">
                            <div class="info-group">
                                <label>Customer:</label>
                                <p>${order.customer_name || 'Guest'}</p>
                            </div>
                            <div class="info-group">
                                <label>Email:</label>
                                <p>${order.customer_email || 'N/A'}</p>
                            </div>
                            <div class="info-group">
                                <label>Phone:</label>
                                <p>${order.customer_phone || 'N/A'}</p>
                            </div>
                            <div class="info-group">
                                <label>Date:</label>
                                <p>${formattedDate}</p>
                            </div>
                            <div class="info-group">
                                <label>Address:</label>
                                <p>${order.delivery_address || 'N/A'}</p>
                            </div>
                            <div class="info-group">
                                <label>Total Amount:</label>
                                <p>₹${order.total_amount ? order.total_amount.toFixed(2) : 'N/A'}</p>
                            </div>
                        </div>
                        
                        <div class="order-items-section">
                            <h4>Order Items</h4>
                            ${itemsHtml}
                        </div>
                        
                        <div class="order-notes">
                            <h4>Notes</h4>
                            <p>${order.notes || 'No notes provided'}</p>
                        </div>
                    </div>
                `;
                
                // Set the details content and show the modal
                orderDetailsContent.innerHTML = detailsHtml;
                orderDetailsModal.style.display = 'block';
            }
            
            // Update order status
            async function updateOrderStatus(orderId, newStatus) {
                try {
                    const { data, error } = await supabase
                        .from('orders')
                        .update({ status: newStatus })
                        .eq('id', orderId);
                    
                    if (error) throw error;
                    
                    // Update the order in the allOrders array
                    const orderIndex = allOrders.findIndex(o => o.id == orderId);
                    if (orderIndex !== -1) {
                        allOrders[orderIndex].status = newStatus;
                    }
                    
                    // Close the modal and refresh the table
                    closeModal();
                    filterAndDisplayOrders();
                    
                    // Show success message
                    showSuccessMessage(`Order #${orderId} status updated to ${newStatus}`);
                    
                } catch (error) {
                    console.error('Error updating order status:', error);
                    showErrorMessage('Failed to update order status. Please try again.');
                }
            }
            
            // Show success message
            function showSuccessMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'success-message';
                messageDiv.textContent = message;
                
                document.body.appendChild(messageDiv);
                
                setTimeout(() => {
                    messageDiv.classList.add('show');
                }, 10);
                
                setTimeout(() => {
                    messageDiv.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(messageDiv);
                    }, 300);
                }, 3000);
            }
            
            // Show error message
            function showErrorMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'error-message';
                messageDiv.textContent = message;
                
                document.body.appendChild(messageDiv);
                
                setTimeout(() => {
                    messageDiv.classList.add('show');
                }, 10);
                
                setTimeout(() => {
                    messageDiv.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(messageDiv);
                    }, 300);
                }, 3000);
            }
            
            // Close modal
            function closeModal() {
                orderDetailsModal.style.display = 'none';
                currentOrderId = null;
            }
            
            // Setup event listeners
            function setupEventListeners() {
                // Filter change events
                statusFilter.addEventListener('change', function() {
                    currentPage = 1;
                    filterAndDisplayOrders();
                });
                
                dateFilter.addEventListener('change', function() {
                    currentPage = 1;
                    filterAndDisplayOrders();
                });
                
                // Clear filters button
                clearFiltersBtn.addEventListener('click', function() {
                    statusFilter.value = 'all';
                    dateFilter.value = '';
                    currentPage = 1;
                    filterAndDisplayOrders();
                });
                
                // Pagination buttons
                prevPageBtn.addEventListener('click', function() {
                    if (currentPage > 1) {
                        currentPage--;
                        filterAndDisplayOrders();
                    }
                });
                
                nextPageBtn.addEventListener('click', function() {
                    currentPage++;
                    filterAndDisplayOrders();
                });
                
                // Update order status button
                updateOrderStatusBtn.addEventListener('click', function() {
                    if (currentOrderId) {
                        const newStatus = orderStatusSelect.value;
                        updateOrderStatus(currentOrderId, newStatus);
                    }
                });
                
                // Close modal buttons
                document.querySelectorAll('.close-modal').forEach(button => {
                    button.addEventListener('click', closeModal);
                });
                
                // Close modal when clicking outside
                window.addEventListener('click', function(event) {
                    if (event.target === orderDetailsModal) {
                        closeModal();
                    }
                });
            }
            
            // Admin authentication
            const adminLoginProtection = document.getElementById('adminLoginProtection');
            const adminLoginForm = document.getElementById('adminLoginForm');
            const adminLoginError = document.getElementById('adminLoginError');
            const adminEmail = document.getElementById('adminEmail');
            const adminPassword = document.getElementById('adminPassword');
            
            // Admin credentials (hardcoded for now - in production this would be handled securely)
            const ADMIN_EMAIL = 'auirphilabakery@gmail.com';
            const ADMIN_PASSWORD = 'Devanshi@2006';
            
            // Check if admin is already logged in
            const isAdminLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
            if (isAdminLoggedIn) {
                // Hide login protection
                adminLoginProtection.style.display = 'none';
                // Initialize the orders page
                initOrdersPage();
            }
            
            // Handle admin login form submission
            adminLoginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = adminEmail.value.trim();
                const password = adminPassword.value;
                
                // Simple validation
                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    // Set admin logged in flag
                    localStorage.setItem('adminLoggedIn', 'true');
                    
                    // Hide login protection
                    adminLoginProtection.style.display = 'none';
                } else {
                    // Show error message
                    adminLoginError.textContent = 'Invalid email or password';
                    adminLoginError.style.display = 'block';
                    
                    // Clear password field
                    adminPassword.value = '';
                    
                    // Shake effect for error
                    adminLoginForm.classList.add('shake');
                    setTimeout(() => {
                        adminLoginForm.classList.remove('shake');
                    }, 500);
                }
            });
            
            // Handle admin logout
            const adminLogout = document.getElementById('adminLogout');
            adminLogout.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Clear admin logged in flag
                localStorage.removeItem('adminLoggedIn');
                
                // Redirect to home page
                window.location.href = '../index.html';
            });
            
            // Mobile menu toggle
            const menuToggle = document.getElementById('menuToggle');
            const adminSidebar = document.getElementById('adminSidebar');
            
            menuToggle.addEventListener('click', function() {
                adminSidebar.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
